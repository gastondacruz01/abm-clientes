<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ABM Clientes</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header>
    <h1>ABM de Clientes</h1>
    <p class="subtitle">Proyecto base SDLC — las funcionalidades se habilitan al implementar cada User Story</p>
  </header>

  <main>
    <!-- US-001: Alta de cliente. El formulario existe pero el submit se implementa con la US. -->
    <section class="card" id="form-section">
      <h2 id="form-title">Nuevo cliente</h2>
      <div class="form-grid">
        <label>Nombre <input type="text" id="nombre" placeholder="Juan" /></label>
        <label>Apellido <input type="text" id="apellido" placeholder="Pérez" /></label>
        <label>Documento <input type="text" id="documento" placeholder="30123456" /></label>
        <label>Email <input type="email" id="email" placeholder="juan@mail.com" /></label>
      </div>
      <div class="actions">
        <button id="btn-guardar">Guardar</button>
        <button id="btn-cancelar" class="secondary hidden">Cancelar</button>
      </div>
      <p id="form-error" class="error hidden"></p>
    </section>

    <!-- US-005: Búsqueda -->
    <section class="card">
      <input type="search" id="buscador" placeholder="Buscar por nombre, apellido o documento... (US-005)" />
    </section>

    <section class="card">
      <h2>Clientes</h2>
      <table id="tabla-clientes">
        <thead>
          <tr>
            <th>ID</th><th>Nombre</th><th>Apellido</th><th>Documento</th><th>Email</th><th>Acciones</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
      <p id="empty-state" class="hidden">No hay clientes cargados.</p>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
